buildscript {
    repositories {
        google() // Make sure Google's repository is included
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0' // This line might already exist, ensure it's using version 7.3.0 or another compatible version
        classpath 'com.google.gms:google-services:4.3.15' // Add this line for Google Services
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}